name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          # Build-time only placeholders -- the app doesn't need real Redis/MongoDB to build,
          # only to run (see README "Getting Started").
          MONGODB_URI: mongodb://localhost:27017/whiteboard
          REDIS_URL: redis://localhost:6379
